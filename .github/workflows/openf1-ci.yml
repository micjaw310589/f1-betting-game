name: OpenF1 CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build images
        run: docker compose build --no-cache
      - name: Run smoke test (drivers)
        run: docker compose run --rm openf1-cli drivers --params session_key=latest