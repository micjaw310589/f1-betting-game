version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: my_local_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_panel
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

  openf1-cli:
    build:
      context: ./openf1
    image: openf1-cli:local
    environment:
      - OPENF1_BASE_URL=${OPENF1_BASE_URL}
    command: tail -f /dev/null

  cli-tester:
    build:
      context: .
      dockerfile: openf1/cli_tester/Dockerfile
    image: cli-tester:local
    ports:
      - "${CLI_TESTER_PORT:-5000}:5000"
    environment:
      - OPENF1_BASE_URL=${OPENF1_BASE_URL}
      - OPENF1_CLI_PATH=/app/openf1_cli.py
      - CLI_TESTER_PORT=${CLI_TESTER_PORT}
    depends_on:
      - openf1-cli
      - db

volumes:
  postgres_data: