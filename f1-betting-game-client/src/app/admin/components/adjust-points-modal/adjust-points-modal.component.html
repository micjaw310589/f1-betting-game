<div class="modal-overlay" (click)="onCancel()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2>Adjust Points</h2>
            <button class="close-btn" (click)="onCancel()">✕</button>
        </div>

        <div class="modal-body">
            <p class="modal-description">
                Adjusting points for user: <strong>{{ username() }}</strong>
            </p>

            @if (errorMessage) {
                <div class="alert alert-error">{{ errorMessage }}</div>
            }

            @if (successMessage) {
                <div class="alert alert-success">{{ successMessage }}</div>
            }

            <div class="form-group">
                <label for="points">Points Adjustment</label>
                <input
                    id="points"
                    type="number"
                    [(ngModel)]="points"
                    placeholder="Enter positive to add, negative to remove"
                    [disabled]="isLoading"
                />
                <span class="form-hint">
                    Positive values add points, negative values remove points.
                </span>
            </div>

            <div class="form-group">
                <label for="reason">Reason (optional)</label>
                <textarea
                    id="reason"
                    [(ngModel)]="reason"
                    placeholder="Enter a reason for this adjustment..."
                    rows="3"
                    [disabled]="isLoading"
                ></textarea>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" (click)="onCancel()" [disabled]="isLoading">
                Cancel
            </button>
            <button class="btn btn-primary" (click)="submit()" [disabled]="isLoading">
                @if (isLoading) {
                    <span class="spinner-small"></span> Processing...
                } @else {
                    Confirm Adjustment
                }
            </button>
        </div>
    </div>
</div>
