<div class="modal-overlay" (click)="onCancel()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2>Adjust Points</h2>
            <button class="close-btn" (click)="onCancel()">✕</button>
        </div>

        <div class="modal-body">
            <p class="modal-description">
                Adjusting points for user: <strong>{{ username() }}</strong>
            </p>

            @if (errorMessage) {
                <div class="error-banner">{{ errorMessage }}</div>
            }

            @if (successMessage) {
                <div class="success-banner">{{ successMessage }}</div>
            }

            <div class="form-group">
                <label for="points">Points Adjustment</label>
                <input
                    id="points"
                    type="number"
                    [(ngModel)]="points"
                    placeholder="e.g. 500 or -500"
                    [disabled]="isLoading"
                />
                <span class="form-hint">
                    Positive values add points, negative values remove points.
                </span>
            </div>

            <div class="form-group">
                <label for="reason">Reason (optional)</label>
                <textarea
                    id="reason"
                    [(ngModel)]="reason"
                    placeholder="Enter a reason for this adjustment..."
                    rows="3"
                    [disabled]="isLoading"
                ></textarea>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" (click)="onCancel()" [disabled]="isLoading">
                <span>Cancel</span>
            </button>
            <button class="btn btn-primary" (click)="submit()" [disabled]="isLoading">
                <span>
                    @if (isLoading) { Processing... } @else { Confirm Adjustment }
                </span>
            </button>
        </div>
    </div>
</div>
