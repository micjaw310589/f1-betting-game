<nav class="main-nav" *ngIf="showNavbar$ | async">
  <div class="nav-container">
    <div class="nav-group">
      <!-- Przycisk Races jako główny punkt -->
      <a routerLink="/races" routerLinkActive="active" class="nav-btn">Races</a>
    </div>

    <div class="nav-group">
      <!-- Widoczne tylko gdy użytkownik NIE jest zalogowany -->
      <ng-container *ngIf="!(authService.currentUser | async)">
        <a routerLink="/auth/login" class="nav-btn">Login</a>
        <a routerLink="/auth/register" class="nav-btn active-blue">Register</a>
      </ng-container>

      <!-- Widoczne tylko gdy użytkownik JEST zalogowany -->
      <ng-container *ngIf="authService.currentUser | async as user">
        <a routerLink="/profile" routerLinkActive="active" class="nav-btn">
           My profile
        </a>
        <button (click)="onLogout()" class="nav-btn logout-btn">
          Logout ({{ user.user?.username }})
        </button>
      </ng-container>
    </div>
  </div>
</nav>
